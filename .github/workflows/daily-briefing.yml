name: Daily Market Briefing

on:
  schedule:
    # 6 AM MDT (UTC-6) = 12 PM UTC, weekdays only
    - cron: "0 12 * * 1-5"
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e . -c requirements-lock.txt

      - name: Run pipeline
        id: run_pipeline
        env:
          CLAUDE_API_KEY_1: ${{ secrets.CLAUDE_API_KEY_1 }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          NEWSAPI_API_KEY: ${{ secrets.NEWSAPI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # Alpaca market data (judge + sparklines, Cycle 5) + paper trading
          # (Cycle 6). Paper keys — no live-trading host is referenced anywhere.
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: market-mover

      - name: Commit Yesterday-Index + paper-trades records
        # Persist both append-only ledgers back to main so tomorrow's run can
        # render the scorecard AND the paper track record survives across the
        # fresh-checkout cron. Best-effort — a push race (cron + manual dispatch
        # in the same minute) leaves the loser as a dropped row; we log and move
        # on rather than fail the workflow. The email already shipped.
        if: success()
        run: |
          set -e
          DATE=$(date -u +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage whichever ledgers this run produced (either may be absent).
          git add data/briefings.jsonl 2>/dev/null || true
          git add data/paper_trades.jsonl 2>/dev/null || true
          # Regenerated browsable scores page (MM-T003) — served via GitHub Pages.
          git add docs/scores.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data ledger changes this run; nothing to commit."
            exit 0
          fi
          git commit -m "chore(data): record briefing + paper trades for ${DATE}"
          # Allow the push to fail without failing the workflow — the email has
          # already gone out and the rows are in this runner's local files. A
          # racing run will overwrite or we'll catch up tomorrow.
          if ! git push; then
            echo "::warning::Push of data ledgers failed (likely race with concurrent run). Data for ${DATE} is local to this runner but did not propagate."
          fi

      - name: Open failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue create \
            --title "[daily-briefing failed] ${DATE}" \
            --body "The daily market briefing workflow failed on ${DATE}.

          Run: ${RUN_URL}
          Workflow: ${GITHUB_WORKFLOW}
          Trigger: ${GITHUB_EVENT_NAME}

          Joe — please check the logs above. The May 5 / Apr 28 2026 hangs were caused by missing HTTP timeouts; if this looks similar, escalate." \
            --label "automated,daily-briefing-failure" || \
          gh issue create \
            --title "[daily-briefing failed] ${DATE}" \
            --body "The daily market briefing workflow failed on ${DATE}. Run: ${RUN_URL}"

      - name: Email failure alert
        # Best-effort SMTP alert so an outage is caught the next morning instead
        # of going unnoticed for days (the 2026-06-16..23 retired-model outage
        # ran silent for a week). Pure stdlib smtplib — works even if the app
        # code is what broke. Never fails the job (already failed; this is just
        # notification).
        if: failure()
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, smtplib, ssl
          from datetime import datetime, timezone
          from email.message import EmailMessage

          user = os.environ.get("SMTP_USERNAME", "")
          pw = os.environ.get("SMTP_APP_PASSWORD", "")
          if not user or not pw:
              print("No SMTP creds in env; skipping failure alert.")
              raise SystemExit(0)

          date = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          run_url = (
              f"{os.environ.get('GITHUB_SERVER_URL','https://github.com')}/"
              f"{os.environ.get('GITHUB_REPOSITORY','')}/actions/runs/"
              f"{os.environ.get('GITHUB_RUN_ID','')}"
          )
          msg = EmailMessage()
          msg["Subject"] = f"[ALERT] Market Mover briefing FAILED - {date}"
          msg["From"] = user
          msg["To"] = user  # alert the operator, not the subscriber list
          msg.set_content(
              f"The daily Market Mover briefing FAILED on {date} and no email was "
              f"sent to recipients.\n\n"
              f"Run logs: {run_url}\n\n"
              "Most likely causes: a retired LLM model (404), an expired API key, "
              "or an upstream timeout. Check the 'Run pipeline' step in the logs.\n"
          )
          try:
              with smtplib.SMTP("smtp.gmail.com", 587, timeout=30) as s:
                  s.starttls(context=ssl.create_default_context())
                  s.login(user, pw)
                  s.send_message(msg)
              print(f"Failure alert emailed to {user}")
          except Exception as e:
              print(f"Failure alert send failed (non-fatal): {e}")
          PY
